# Atlas CD — build, scan and publish the runtime images (docs/17 §3, §5).
#
# What this closes: CI proved code correct but stopped there, so there was no artifact to deploy and
# the first production deploy would have been a laptop running `docker build` by hand — manual and
# unreproducible. This publishes immutable, digest-pinned, SBOM-carrying images to GHCR on every
# green push to main.
#
# Then it rolls out to Fly.io (docs/17 DD-2) — but only once `vars.FLY_DEPLOY_ENABLED == 'true'`,
# so the publish half works from day one and the deploy half switches on when the Fly apps exist.
# The API deploy also runs expand migrations, via fly.toml's `release_command`.
#
# Registry: GHCR (ghcr.io/<owner>/atlas-{api,web}). Chosen because it needs no cloud credentials —
# GITHUB_TOKEN authenticates it. Fly builds its own image from the same Dockerfile rather than
# pulling from GHCR, which avoids wiring private-registry auth into Fly; GHCR remains the portable,
# SBOM-carrying artifact you can deploy anywhere else (including ECS later).
name: Release

on:
  push:
    branches: [main]
  # Manual runs let you cut an image from any ref without pushing a commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished publish

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build · scan · push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless (Sigstore) signing — provenance without managing a key
      security-events: write # upload the Trivy scan to the Security tab
    strategy:
      # Independent images: a web failure shouldn't abandon a good api build.
      fail-fast: false
      matrix:
        include:
          - image: atlas-api
            dockerfile: Dockerfile
          - image: atlas-web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tags keyed to the commit (docs/17 §3: "immutable tags (git SHA), never `latest` in
      # prod"). `edge` is a moving convenience pointer for dev/staging — never deploy it to prod.
      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable={{is_default_branch}}

      # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so the web image is
      # environment-specific: these values are baked into the JS the browser downloads and cannot be
      # overridden at runtime. They must be repository variables (public by nature — the Supabase
      # anon key is safe to ship; the service-role key must never appear here).
      # Until vars.NEXT_PUBLIC_API_URL etc. are set, the web image builds against placeholders and is
      # only good for smoke-testing — set them before deploying the web image anywhere real.
      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true # docs/13 §11 — SBOM per image
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4290' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Scan the image we just pushed, by DIGEST — scanning the tag could race another push.
      # Reported, not blocking: a base-image CVE disclosed after a good build shouldn't retroactively
      # break the pipeline. `pnpm audit` in CI is the blocking gate for OUR dependency tree; this
      # covers the OS layer, where the right response is usually "rebuild on a fresh base".
      - name: Scan the published image
        # Tags on this action are v-prefixed (`v0.36.0`); an unprefixed one fails the whole job at
        # action-resolution time, before any step runs — which is how the first Release run died.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          ignore-unfixed: true # a CVE with no available patch is noise, not an action
        continue-on-error: true

      - name: Upload the scan to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
        continue-on-error: true

      - name: Summarize
        run: |
          {
            echo "### \`${{ matrix.image }}\` published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |"
            echo
            echo "Deploy by DIGEST, not tag — digests are immutable, tags can move."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy · Fly.io
    needs: publish
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable FLY_DEPLOY_ENABLED=true once the Fly apps exist. Until
    # then every other job still runs and images still publish — the pipeline just stops before
    # rollout instead of failing red on a missing token. (A repo VARIABLE, not a secret: secrets
    # can't be referenced in a job-level `if`.)
    if: ${{ vars.FLY_DEPLOY_ENABLED == 'true' }}
    # `production` lets you add a required reviewer in repo settings if you want promotion gated.
    environment: production
    # Never let two rollouts race; unlike CI, don't cancel one midway through.
    concurrency:
      group: deploy-fly
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploys the API AND runs expand migrations: fly.toml's `release_command` executes
      # `@atlas/db`'s compiled migrate in a temporary machine before the new version takes traffic,
      # and a non-zero exit aborts the rollout (docs/04 DD-6). Health checks gate the rolling
      # replacement, so a machine that fails /health/ready never receives traffic.
      - name: Deploy API + run migrations
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time, so they're build args here,
      # not secrets or env. Repository variables (not secrets) because they ship to every browser
      # anyway — and keeping them out of the secret store makes it obvious they aren't private.
      - name: Deploy web
        run: |
          flyctl deploy --remote-only --config fly.web.toml \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Verify the API is serving
        run: |
          url="${API_URL:-https://atlas-api-anmol.fly.dev}/health/ready"
          for i in $(seq 1 10); do
            if curl -fsS "$url" | grep -q '"db":"up"'; then
              echo "Ready: $url"; exit 0
            fi
            echo "attempt $i: not ready yet"; sleep 10
          done
          echo "::error::API did not report ready after deploy — check \`fly logs -a atlas-api-anmol\`"
          exit 1
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
