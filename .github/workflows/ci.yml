# Atlas CI — runs the quality gates on every push to main (docs/14 §16, docs/17 §5).
# Gates: format, lint, typecheck, unit test (check job) + integration tests against a
# real ephemeral Postgres with the two-role setup + RLS incl. the append-only audit log
# (integration job, US-12) + a production web build (web-build job) + the AI-eval gate
# (ai-eval job — grounded/cited/honest-absence set, escaped-hallucination-zero, docs/14 §11).
# Mutation testing runs nightly in a separate workflow (mutation.yml). Heavier stages still to
# come (API contract, the adversarial QA agent, E2E, load) land as those capabilities arrive
# (see docs/14 §16 for the full sequence).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  integration:
    name: Integration · Postgres + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations + admin (seed/teardown) connect as the owner; tests' "app" role
      # connects as the non-bypass atlas_app (RLS enforced). docs/04 §10, docs/13 §6.
      DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/postgres
      ATLAS_APP_PASSWORD: atlas_ci_pw
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://atlas_app:atlas_ci_pw@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run migrations (owner role)
        run: pnpm --filter @atlas/db run migrate

      - name: Grant atlas_app LOGIN (CI throwaway password)
        run: pnpm --filter @atlas/db run setup:app-role

      - name: Integration tests (Postgres + RLS + staged sync + audit log)
        run: pnpm run test

  web-build:
    name: Web · Production build
    runs-on: ubuntu-latest
    # Catches build-time regressions the unit gates miss (e.g. an env/NODE_ENV or RSC
    # boundary break). The build script forces NODE_ENV=production; NEXT_PUBLIC_* are
    # inlined at build time so placeholders suffice (no network/secrets needed).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:4290
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web (next build, production)
        run: pnpm --filter @atlas/web run build

  ai-eval:
    name: AI · Eval (grounding · citations · honest absence)
    runs-on: ubuntu-latest
    # The AI answer/diagnose eval set (docs/14 §11): grounded + cited + confidence-tiered answers,
    # US-11 honest absence, and the adversarial tempt-to-hallucinate cases whose escaped-hallucination
    # rate must stay 0 (docs/01 §7.3). Deterministic — a MockLLMProvider drives it, so no model, network
    # or secret is needed; surfaced as its own required check so a grounding regression is unmissable
    # (it also runs inside `check` via turbo, but that buries it).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: AI eval set
        run: pnpm --filter @atlas/ai run test
