# Atlas CI — runs the quality gates on every push to main (docs/14 §16, docs/17 §5).
# Gates: format, lint, typecheck, unit test (check job) + integration tests against a
# real ephemeral Postgres with the two-role setup + RLS incl. the append-only audit log
# (integration job, US-12) + a production web build (web-build job) + the AI-eval gate
# (ai-eval job — grounded/cited/honest-absence set, escaped-hallucination-zero, docs/14 §11)
# + supply-chain scanning (security job: dependency advisories + secret scan, docs/13/16)
# + a real `docker build` of both runtime images (images job, docs/17 §3).
# Mutation testing runs nightly in a separate workflow (mutation.yml). Heavier stages still to
# come (API contract, the adversarial QA agent, E2E, load) land as those capabilities arrive
# (see docs/14 §16 for the full sequence).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  integration:
    name: Integration · Postgres + RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations + admin (seed/teardown) connect as the owner; tests' "app" role
      # connects as the non-bypass atlas_app (RLS enforced). docs/04 §10, docs/13 §6.
      DATABASE_URL_MIGRATE: postgres://postgres:postgres@localhost:5432/postgres
      ATLAS_APP_PASSWORD: atlas_ci_pw
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://atlas_app:atlas_ci_pw@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run migrations (owner role)
        run: pnpm --filter @atlas/db run migrate

      - name: Grant atlas_app LOGIN (CI throwaway password)
        run: pnpm --filter @atlas/db run setup:app-role

      - name: Integration tests (Postgres + RLS + staged sync + audit log)
        run: pnpm run test

  web-build:
    name: Web · Production build
    runs-on: ubuntu-latest
    # Catches build-time regressions the unit gates miss (e.g. an env/NODE_ENV or RSC
    # boundary break). The build script forces NODE_ENV=production; NEXT_PUBLIC_* are
    # inlined at build time so placeholders suffice (no network/secrets needed).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:4290
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web (next build, production)
        run: pnpm --filter @atlas/web run build

  ai-eval:
    name: AI · Eval (grounding · citations · honest absence)
    runs-on: ubuntu-latest
    # The AI answer/diagnose eval set (docs/14 §11): grounded + cited + confidence-tiered answers,
    # US-11 honest absence, and the adversarial tempt-to-hallucinate cases whose escaped-hallucination
    # rate must stay 0 (docs/01 §7.3). Deterministic — a MockLLMProvider drives it, so no model, network
    # or secret is needed; surfaced as its own required check so a grounding regression is unmissable
    # (it also runs inside `check` via turbo, but that buries it).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: AI eval set
        run: pnpm --filter @atlas/ai run test

  security:
    name: Security · Dependencies + secrets
    runs-on: ubuntu-latest
    # docs/17 §5 sequences a "secret scan + dep vuln scan" gate before build; it had never been
    # wired, and a readiness audit found 16 live advisories (9 high) sitting in the lockfile —
    # including an HTTP/2 DoS in Fastify's own router. Both scans are cheap; run them on every push.
    steps:
      - name: Checkout
        # Full history: gitleaks diffs commits, so a shallow clone would silently scan almost nothing.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # --prod: advisories in devDependencies (test/build tooling) don't ship to customers and would
      # make this gate noisy enough to be ignored. Runtime dependencies are the ones that matter.
      - name: Dependency advisories (runtime deps)
        run: pnpm audit --prod --audit-level moderate

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Images · docker build (api + web)
    runs-on: ubuntu-latest
    # Both Dockerfiles were authored without a local Docker daemon and had NEVER been built — the
    # single largest unknown in the deploy path. This job is the daemon: it builds both images on
    # every push, so a broken Dockerfile fails here instead of during a first production deploy.
    # Build only (no push) — publishing is release.yml's job, gated on this passing.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # GitHub Actions layer cache: the pnpm install + workspace build dominate, and they only
          # change when the lockfile or sources do.
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          # NEXT_PUBLIC_* are inlined into the client bundle at build time, so the image is
          # environment-specific. Placeholders are fine here — this job proves the build works;
          # release.yml passes the real values.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ci.example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
            NEXT_PUBLIC_API_URL=http://localhost:4290
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Prove the API image actually boots, not just that it compiles. Config is fail-fast in prod,
      # so a NODE_ENV=production run with no env is EXPECTED to exit non-zero listing missing vars —
      # that specific failure is the success signal: the entrypoint resolved and the app started.
      # A missing module or a bad `pnpm deploy` layer looks completely different.
      - name: Smoke-test the API entrypoint
        run: |
          docker build -t atlas-api:smoke .
          output=$(docker run --rm -e NODE_ENV=production atlas-api:smoke 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Invalid environment configuration" \
            || { echo "::error::API image did not reach config validation — the entrypoint is broken."; exit 1; }
          echo "API image boots and reaches config validation."
